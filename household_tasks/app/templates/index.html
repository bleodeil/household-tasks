<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Household Tasks</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">

    <header id="header">
      <button id="btn-back" class="btn-icon hidden" aria-label="Back">‹</button>
      <h1 id="header-title">Household Tasks</h1>
      <button id="btn-add" class="btn-icon" aria-label="Add">+</button>
    </header>

    <main id="content">
      <div class="loading">Loading…</div>
    </main>

    <nav id="bottom-nav">
      <button class="nav-btn active" data-view="rooms" aria-label="Rooms">
        <span class="nav-icon" aria-hidden="true">🏠</span>
        <span>Rooms</span>
      </button>
      <button class="nav-btn" data-view="members" aria-label="Members">
        <span class="nav-icon" aria-hidden="true">👥</span>
        <span>Members</span>
      </button>
    </nav>

  </div>

  <!-- Modal sheet -->
  <div id="modal-overlay" class="hidden" role="dialog" aria-modal="true">
    <div id="modal"></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
